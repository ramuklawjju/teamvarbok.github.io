<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Varbok | Play-Based Early Learning in Bengaluru</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta
      content="Varbok is a warm, play-based early-childhood learning centre in Bengaluru, nurturing curious, confident and kind children through playgroup, nursery and kindergarten."
      name="description"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Varbok | Play-Based Early Learning in Bengaluru" />
    <meta
      property="og:description"
      content="A warm, play-based early-childhood learning centre nurturing curious, confident and kind children across kindergarten and early primary."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="img/header.png" />
    <meta property="og:url" content="https://teamvarbok.github.io/index.html" />

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Handlee&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Flaticon Font -->
    <link href="lib/flaticon/font/flaticon.css" rel="stylesheet" />

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet" />

    <!-- Bootstrap base + Varbok "Joyful Premium" design system -->
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/varbok.css" rel="stylesheet" />

    <!-- Enable progressive scroll-reveal only when JS is available -->
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>

  <body>
    <!-- Navbar (injected from partials/navbar.html) -->
    <div data-include="partials/navbar.html"></div>

    <!-- Hero -->
    <header class="hero">
      <div
        class="blob-deco"
        style="width: 360px; height: 360px; background: var(--coral-50); top: -90px; left: -100px;"
      ></div>
      <div
        class="blob-deco"
        style="width: 260px; height: 260px; background: var(--amber-50); bottom: -80px; right: 6%;"
      ></div>
      <div class="container position-relative">
        <div class="row align-items-center">
          <div class="col-lg-6 text-center text-lg-left reveal">
            <span class="eyebrow">Where little hearts learn to bloom</span>
            <h1>
              Joyful beginnings for India's
              <span class="hl">youngest learners</span>
            </h1>
            <p class="lead mb-4">
              At Varbok, every day blends play, discovery and care, so your
              child grows confident, curious and kind, one happy little step at
              a time.
            </p>
            <div
              class="d-flex flex-wrap justify-content-center justify-content-lg-start"
              style="gap: 0.8rem;"
            >
              <a href="#book-a-seat" class="btn btn-primary btn-lg">Book a visit</a>
              <a href="class.html" class="btn btn-outline-primary btn-lg"
                >Explore classes</a
              >
            </div>
            <div class="hero-trust">
              <div class="avatars" aria-hidden="true">
                <img src="img/testimonial-1.jpg" alt="" loading="lazy" />
                <img src="img/testimonial-2.jpg" alt="" loading="lazy" />
                <img src="img/testimonial-3.jpg" alt="" loading="lazy" />
                <img src="img/testimonial-4.jpg" alt="" loading="lazy" />
              </div>
              <small>Loved by <strong>500+ families</strong><br />across Bengaluru</small>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="hero-art-wrap reveal d2">
              <div class="hero-blob" aria-hidden="true"></div>
              <img
                class="img-fluid hero-art"
                src="img/header1.png"
                alt="Joyful illustration of a young learner reading and discovering at Varbok"
                width="600"
                height="600"
              />
              <span class="hero-chip c1" aria-hidden="true"
                ><i class="fas fa-star"></i
              ></span>
              <span class="hero-chip c2" aria-hidden="true"
                ><i class="fas fa-palette"></i
              ></span>
              <span class="hero-chip c3" aria-hidden="true"
                ><i class="fas fa-music"></i
              ></span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Footer (injected from partials/footer.html) -->
    <div data-include="partials/footer.html"></div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="js/components.js"></script>
    <script src="mail/contact.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
